version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kilindi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kilindi
      POSTGRES_PASSWORD: kilindi_password
      POSTGRES_DB: kilindi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kilindi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  db_data: {}
  redis_data: {}